name: Build PriyamTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project Files
        run: flutter create . --platforms=android --org=com.priyamtv --project-name=priyamtv

      # --- Changes app name on launcher from priyam_tv to PriyamTV ---
      - name: Set App Launcher Name
        run: |
          sed -i 's/android:label="priyam_tv"/android:label="PriyamTV"/g' android/app/src/main/AndroidManifest.xml

      # --- Center-crops logo.jpeg and scales it to 192x192 icon ---
      - name: Install ImageMagick & Auto-Crop Screenshot into Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert "logo.jpeg" -gravity Center -crop 720x720+0+0 +repage -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriyamTV-Release
          path: build/app/outputs/flutter-apk/app-release.apk
